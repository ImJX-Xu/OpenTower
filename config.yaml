# OpenTower V3.1 — Agent OS Configuration
# Agent behavior, skills, channels, heartbeat — all in one file.

agent:
  name: "OpenTower"
  version: "3.1"

  system_prompt: |
    你是 OpenTower，一个自主运行的 Agent 操作系统。
    你可以执行 shell 命令、浏览网页、查询数据、调用 API、操作文件。

    行动原则：
    1. 分析用户意图，选择最合适的 skill
    2. 执行 skill，检查结果
    3. 如需多步，逐步执行，每步反思
    4. 汇总结果，简洁回报

    你可以使用的 skills 列在工具列表中。
    选择最合适的 skill 执行任务。如果没有合适的 skill，用 shell 执行。
    始终用与用户相同的语言回复。

  llm:
    base_url: ${OPENAI_BASE_URL:-http://ai-5090:8000/v1}
    api_key: ${OPENAI_API_KEY:-no-key}
    model: ${LLM_MODEL:-qwen35}
    max_tokens: 2048
    temperature: 0.3

  memory:
    backend: sqlite
    path: opentower.db
    max_history: 50

# ── Skills ──────────────────────────────────────────────────────
skills:
  # P0: Top high-frequency skills (60%+ of agent calls)
  - name: shell
    type: python
    module: opentower.skills.shell
    description: "Execute shell commands"

  - name: filesystem
    type: python
    module: opentower.skills.filesystem
    description: "Read, write, list files and directories"

  - name: python_exec
    type: python
    module: opentower.skills.python_exec
    description: "Execute Python code snippets"

  - name: browser
    type: python
    module: opentower.skills.browser
    description: "Browse web pages and search the internet"

  - name: data_query
    type: python
    module: opentower.skills.data_query
    description: "Query CSV/SQLite data with SQL"

  - name: http_api
    type: python
    module: opentower.skills.http_api
    description: "Make HTTP API requests and send webhooks"

  # MCP servers (uncomment to enable)
  # - name: github
  #   type: mcp
  #   command: "npx -y @anthropic/mcp-github"
  #   env:
  #     GITHUB_TOKEN: ${GITHUB_TOKEN}

# ── Channels ───────────────────────────────────────────────────
channels:
  - type: cli
    enabled: true

  - type: webhook
    port: 8080
    enabled: false

  - type: feishu
    enabled: false
    # app_id: ${FEISHU_APP_ID}
    # app_secret: ${FEISHU_APP_SECRET}
    # port: 9000

# ── MCP Server ─────────────────────────────────────────────────
# Expose OpenTower's skills to other agents via MCP protocol
# mcp_server:
#   enabled: false
#   transport: stdio  # or http
#   port: 3100

# ── Heartbeat & Scheduler ─────────────────────────────────────
heartbeat:
  enabled: true
  interval: 300
  on_wake:
    - check_pending_tasks
    - run_scheduled_jobs

schedules: []
