# OpenTower V3.0 — Agent OS Configuration
# This single file defines everything: agent behavior, skills, channels, schedule.

agent:
  name: "OpenTower"
  version: "3.0"

  # System prompt — defines the agent's personality and decision-making
  system_prompt: |
    你是 OpenTower，一个自主运行的 Agent 操作系统。
    你可以执行 shell 命令、操作文件、浏览网页、发送邮件。

    行动原则：
    1. 分析用户意图，拆解为可执行的原子步骤
    2. 依次执行每个步骤，使用可用的 skills
    3. 检查执行结果，如有问题则自动修正
    4. 汇总结果，简洁回报

    你可以使用的 skills 列在工具列表中。
    选择最合适的 skill 执行任务。如果没有合适的 skill，用 shell 执行。

  # LLM Configuration
  llm:
    base_url: ${OPENAI_BASE_URL:-http://localhost:1234/v1}
    api_key: ${OPENAI_API_KEY:-no-key}
    model: ${LLM_MODEL:-default}
    max_tokens: 2048
    temperature: 0.3

  # Memory
  memory:
    backend: sqlite
    path: opentower.db
    max_history: 50        # per-conversation memory depth

# ── Skills ──────────────────────────────────────────────────────
# Each skill is a capability the agent can invoke.
# Types: python (local .py), cli (subprocess), mcp (MCP server)
skills:
  - name: shell
    type: python
    module: opentower.skills.shell
    description: "Execute shell commands"
    enabled: true

  - name: filesystem
    type: python
    module: opentower.skills.filesystem
    description: "Read, write, list files and directories"
    enabled: true

  - name: python_exec
    type: python
    module: opentower.skills.python_exec
    description: "Execute Python code snippets"
    enabled: true

  # MCP servers (uncomment to enable)
  # - name: github
  #   type: mcp
  #   command: "npx -y @anthropic/mcp-github"
  #   env:
  #     GITHUB_TOKEN: ${GITHUB_TOKEN}

# ── Channels ───────────────────────────────────────────────────
# How users interact with the agent.
channels:
  - type: cli
    enabled: true

  # - type: telegram
  #   token: ${TELEGRAM_BOT_TOKEN}
  #   enabled: false

  - type: webhook
    port: 8080
    enabled: false

# ── Heartbeat & Scheduler ─────────────────────────────────────
# Agent wakes up periodically to check tasks and run scheduled jobs.
heartbeat:
  enabled: true
  interval: 300            # seconds between heartbeats (5 min)
  on_wake:
    - check_pending_tasks
    - run_scheduled_jobs

schedules: []
  # - cron: "0 9 * * *"
  #   action: "Review yesterday's completed tasks and plan today"
  # - cron: "*/30 * * * *"
  #   action: "Check for any urgent pending tasks"
