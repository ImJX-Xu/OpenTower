workflows:
  - id: disk-inspection
    category: inspect
    summary: Inspect filesystem usage, storage pressure, block-device layout, and optional /var/log size signals.
    default_agents: [intent-parser, security-guard, command-planner, result-analyst]
    handoff_chain: [intent-parser, security-guard, command-planner, result-analyst]
    acceptance_checks: [df_parsed, hot_partition_flagged, natural_language_summary]
    example_prompts:
      - 查看磁盘使用情况
      - 检查分区空间
      - show disk usage
      - inspect /var/log storage pressure

  - id: file-search
    category: inspect
    summary: Find files, search contents, inspect permissions, and read allowed log files safely.
    default_agents: [intent-parser, security-guard, command-planner, result-analyst]
    handoff_chain: [intent-parser, security-guard, command-planner, result-analyst]
    acceptance_checks: [search_scope_validated, results_summarized, dangerous_write_blocked]
    example_prompts:
      - 找到所有 nginx 配置文件
      - "搜索 /etc 下包含 \"database\" 的文件"
      - tail the latest syslog log
      - scan recent auth errors

  - id: process-port-inspection
    category: inspect
    summary: Inspect service status, port ownership, high-memory processes, and read-only CPU/load/uptime signals.
    default_agents: [intent-parser, security-guard, command-planner, result-analyst]
    handoff_chain: [intent-parser, security-guard, command-planner, result-analyst]
    acceptance_checks: [service_or_port_detected, process_output_summarized, natural_language_feedback]
    example_prompts:
      - 哪些进程占用 80 端口
      - 检查 nginx 服务状态
      - show cpu usage
      - show load average

  - id: user-management
    category: operate
    summary: Create, inspect, update, or delete normal Linux users with safety gates.
    default_agents: [intent-parser, security-guard, command-planner, result-analyst]
    handoff_chain: [intent-parser, security-guard, command-planner, result-analyst]
    acceptance_checks: [user_target_parsed, permissions_respected, risky_change_confirmed]
    example_prompts:
      - 列出本机用户
      - 创建用户 dev01 并加入 docker 组
      - 检查用户 dev01 的信息
      - 删除用户 test_user
