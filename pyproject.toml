[project]
name = "opentower"
version = "3.0.0"
description = "OpenTower — Agent OS. Autonomous runtime with Skills, Channels, and Heartbeat."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "OpenTower Contributors"},
]
keywords = ["agent", "llm", "autonomous", "mcp", "skills", "runtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[project.urls]
Homepage = "https://github.com/EmpireTower/OpenTower"
Repository = "https://github.com/EmpireTower/OpenTower"

[project.scripts]
opentower = "opentower.runtime:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
webhook = ["aiohttp>=3.9"]
telegram = ["python-telegram-bot>=21.0"]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["opentower*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
